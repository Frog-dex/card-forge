<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deck Editor — Card Forge</title>
<meta name="description" content="Drag-and-drop editor for the 49-card Spirit Strikers deck.">
<meta name="theme-color" content="#141416">
<link rel="icon" href="elements/emblem_spirit.png">
<link rel="stylesheet" href="assets/forge.css">
<style>
  .toolbar{position:sticky;top:53px;z-index:20;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;
    padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .toolbar .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .toolbar .btn{padding:7px 11px;font-size:13px}
  #hint{color:var(--muted);font-size:12px;padding:8px 16px 0}
  #status{font-size:12px;color:var(--muted)}
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #grid{display:grid;grid-template-columns:120px repeat(7,minmax(84px,1fr));gap:8px;padding:14px 16px 40px;max-width:1500px;min-width:720px}
  .colh{text-align:center;font-weight:700;font-size:12px;letter-spacing:.5px;padding-bottom:2px;text-transform:uppercase;
    display:flex;flex-direction:column;align-items:center;gap:4px}
  .colh img{width:28px}
  .rowh{display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#cfc8ba;font-size:13px;text-align:right;
    position:sticky;left:0;z-index:2;background:linear-gradient(90deg,var(--bg) 80%,transparent)}
  .cell{position:relative;border-radius:9px;transition:transform .12s}
  .cell canvas{width:100%;display:block;border-radius:9px}
  .cell .art{position:absolute;inset:0;cursor:grab;border-radius:9px}
  .cell.drag-over{outline:3px dashed var(--gold);outline-offset:2px}
  .cell.picked{outline:3px solid var(--gold);outline-offset:2px;transform:scale(.96)}
  .cell .art:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
  @media (max-width:760px){
    #hint{display:none}
    .toolbar{top:86px;position:static}
    #grid{grid-template-columns:72px repeat(7,84px);min-width:0;width:max-content;padding:12px}
    .rowh{font-size:11px;padding-right:4px}
  }
</style>
</head>
<body>
<nav class="nav">
  <a class="brand" href="index.html"><img src="elements/emblem_spirit.png" alt="">Card Forge</a>
  <a class="tab" href="index.html">Home</a>
  <a class="tab" href="deck-editor.html" aria-current="page">Deck Editor</a>
  <a class="tab" href="inspector.html">Card Inspector</a>
  <a class="tab" href="marbles.html">Marbles</a>
</nav>
<div class="toolbar">
  <div class="grp">
    <div class="seg"><button class="btn" id="mLight">Light</button><button class="btn on" id="mDark">Dark</button></div>
    <label class="ctl">line thickness <input id="thin" type="range" min="40" max="210" value="110"></label>
  </div>
  <div class="grp">
    <button class="btn" id="undo" disabled>↶ Undo</button>
    <button class="btn" id="reset">Reset</button>
    <button class="btn" id="loadArt" title="Pick line-art PNGs named card-NN.png">📁 Load art…</button>
    <button class="btn" id="impJ">⇪ Import arrangement</button>
  </div>
  <div class="grp">
    <button class="btn" id="expL">⬇ Light PNG</button>
    <button class="btn" id="expD">⬇ Dark PNG</button>
    <button class="btn primary" id="expJ">⬇ arrangement.json</button>
  </div>
  <span id="status"></span>
  <input type="file" id="artFiles" accept="image/png" multiple hidden>
  <input type="file" id="jsonFile" accept="application/json,.json" hidden>
</div>
<p id="hint">Drag any artwork onto another card — or tap one card, then another — to swap positions. Art recolours to its new element; frames and numbered marbles stay put.</p>
<div class="scroller"><div id="grid"></div></div>

<script src="assets/forge.js"></script>
<script>
const CW=Forge.CW, CH=Forge.CH, BLEED=Forge.BLEED;
const CARDW=210, CARDH=Math.round(CARDW*CH/CW), S=CARDW/CW;
let MODE="dark", THIN=110, plan, cols, rows, cells, ELEMHEX={}, artOf={}, artByCard={}, picked=null;
const imgs={}, localArt={}, undoStack=[];
let ART=Forge.artDir();

const loadImg=src=>Forge.img(src);
async function preload(urls){const u=[...new Set(urls)];const arr=await Promise.all(u.map(loadImg));u.forEach((s,i)=>imgs[s]=arr[i]);}

function artURL(card){
  if(!card) return null;
  if(card.startsWith("element-")) return Forge.urls.emblem(card.slice(8));
  return localArt[card]||ART+card+".png";
}
const artImg=a=>a&&a.card?imgs[artURL(a.card)]:null;

function drawCell(cv,r,c){
  const num=r*7+c+1, elem=cols[c], x=cv.getContext("2d");
  const a=artOf[r+"_"+c];
  const isEmb=a&&a.card&&a.card.startsWith("element-");
  x.clearRect(0,0,CARDW,CARDH);
  // interior (emblems always dark; else per mode)
  x.fillStyle=isEmb?"#141418":(MODE==="light"?"#ffffff":"#18181c");
  roundRect(x,0,0,CARDW,CARDH,9);x.fill();
  // artwork
  if(a&&a.art){
    const im=artImg(a);
    if(im){
      const ax=a.art.x*S, ay=a.art.y*S, aw=a.art.w*S, ah=a.art.h*S;
      if(isEmb) x.drawImage(im,ax,ay,aw,ah);
      else x.drawImage(Forge.ink(im,MODE==="light"?[18,18,18]:[242,242,242],THIN),ax,ay,aw,ah);
    }else{
      // art not bundled: faint element glyph marks the slot as "has a card" (blanks stay empty)
      const sym=imgs[Forge.urls.symbol(elem)];
      if(sym){const w=CARDW*0.38, h=w*sym.height/sym.width;x.globalAlpha=0.22;
        x.drawImage(Forge.ink(sym,Forge.hexRGB(ELEMHEX[elem]),20),(CARDW-w)/2,(CARDH-h)/2,w,h);x.globalAlpha=1;}
    }
  }
  // border + marbles (fixed to this position)
  const bd=imgs[Forge.urls.border(elem)]; if(bd)x.drawImage(bd,0,0,CARDW,CARDH);
  const mt=imgs[Forge.urls.marble(num,"top")], mb=imgs[Forge.urls.marble(num,"bot")];
  const D=Forge.MARBLE_D*S, off=(BLEED+5)*S;
  if(mt)x.drawImage(mt,off,off,D,D);
  if(mb)x.drawImage(mb,CARDW-off-D,CARDH-off-D,D,D);
}
function roundRect(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath();}

function renderAll(){document.querySelectorAll("canvas[data-rc]").forEach(cv=>{const [r,c]=cv.dataset.rc.split("_").map(Number);drawCell(cv,r,c);});updateStatus();}
const qc=rc=>document.querySelector('canvas[data-rc="'+rc+'"]');
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const redraw=rc=>drawCell(qc(rc),...rc.split("_").map(Number));

function swap(from,to,record=true){
  if(!from||from===to) return;
  const t=artOf[from];artOf[from]=artOf[to];artOf[to]=t;
  redraw(from);redraw(to);
  if(record){undoStack.push([from,to]);undoBtn.disabled=false;}
}
function clearPick(){if(picked){document.querySelector('.cell[data-rc="'+picked+'"]')?.classList.remove("picked");picked=null;}}
function tap(rc){
  if(!picked){picked=rc;document.querySelector('.cell[data-rc="'+rc+'"]').classList.add("picked");return;}
  const from=picked;clearPick();swap(from,rc);
}

function build(){
  const g=document.getElementById("grid");g.innerHTML="";
  g.appendChild(el("div",""));
  cols.forEach(k=>{const d=el("div","colh");d.innerHTML=`<img src="${Forge.urls.emblem(k)}" alt="">${k}`;d.style.color=ELEMHEX[k];g.appendChild(d);});
  for(let r=0;r<7;r++){
    const rh=el("div","rowh");rh.textContent=rows[r];g.appendChild(rh);
    for(let c=0;c<7;c++){
      const rc=r+"_"+c, cell=el("div","cell");cell.dataset.rc=rc;
      const cv=document.createElement("canvas");cv.width=CARDW;cv.height=CARDH;cv.dataset.rc=rc;cell.appendChild(cv);
      const art=el("div","art");art.draggable=true;art.dataset.rc=rc;art.tabIndex=0;art.setAttribute("role","button");
      art.setAttribute("aria-label",`Card ${r*7+c+1}: ${rows[r]}, ${cols[c]}`);
      cell.appendChild(art);
      art.addEventListener("dragstart",e=>{clearPick();e.dataTransfer.setData("text",rc);});
      art.addEventListener("click",()=>tap(rc));
      art.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tap(rc);} if(e.key==="Escape")clearPick();});
      cell.addEventListener("dragover",e=>{e.preventDefault();cell.classList.add("drag-over");});
      cell.addEventListener("dragleave",()=>cell.classList.remove("drag-over"));
      cell.addEventListener("drop",e=>{e.preventDefault();cell.classList.remove("drag-over");swap(e.dataTransfer.getData("text"),rc);});
      g.appendChild(cell);
    }
  }
  renderAll();
}

function updateStatus(){
  const want=cells.filter(c=>c.card&&!c.card.startsWith("element-"));
  const have=want.filter(c=>imgs[artURL(c.card)]).length;
  document.getElementById("status").textContent=have===want.length?`all ${have} line-art cutouts loaded`
    :`${have}/${want.length} line-art cutouts found — borders, marbles & emblems shown; use “Load art…” for the rest`;
}

function download(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),4000);}

// export full deck sheet (mode) to PNG — with row/column labels in the gutters
function exportSheet(mode){
  const prev=MODE;MODE=mode;
  const TW=CARDW,TH=CARDH,PAD=14,GUT=118,TOP=34,LBL=20;
  const SW=GUT+7*(TW+PAD)+PAD, SH=TOP+7*(TH+LBL+PAD)+PAD;
  const cv=document.createElement("canvas");cv.width=SW;cv.height=SH;const x=cv.getContext("2d");
  x.fillStyle=mode==="light"?"#e8e4dc":"#101012";x.fillRect(0,0,SW,SH);
  x.font="700 13px system-ui,sans-serif";x.textAlign="center";x.textBaseline="middle";
  cols.forEach((k,c)=>{x.fillStyle=ELEMHEX[k];x.fillText(k.toUpperCase(),GUT+c*(TW+PAD)+TW/2,TOP/2+2);});
  const tmp=document.createElement("canvas");tmp.width=TW;tmp.height=TH;
  for(let r=0;r<7;r++){
    const y=TOP+r*(TH+LBL+PAD);
    x.fillStyle=mode==="light"?"#3a3226":"#cfc8ba";x.textAlign="right";x.font="600 13px system-ui,sans-serif";
    x.fillText(rows[r],GUT-12,y+TH/2);
    for(let c=0;c<7;c++){
      drawCell(tmp,r,c);const cx=GUT+c*(TW+PAD);x.drawImage(tmp,cx,y);
      const a=artOf[r+"_"+c];x.textAlign="center";x.font="11px system-ui,sans-serif";x.fillStyle=mode==="light"?"#6b6458":"#8a877f";
      x.fillText(`#${r*7+c+1}${a&&a.card?" · "+a.card:""}`,cx+TW/2,y+TH+LBL/2+1);
    }
  }
  MODE=prev;
  cv.toBlob(b=>download(b,"DECK-"+mode.toUpperCase()+".png"));
}
function arrangement(){const out=[];for(let r=0;r<7;r++)for(let c=0;c<7;c++){const a=artOf[r+"_"+c];out.push({row:r,col:c,num:r*7+c+1,element:cols[c],card:a?a.card:null});}return out;}
function exportJSON(){download(new Blob([JSON.stringify(arrangement(),null,2)],{type:"application/json"}),"arrangement.json");}

function importJSON(list){
  if(!Array.isArray(list)) throw new Error("expected an array");
  for(const it of list){
    if(typeof it.row!=="number"||typeof it.col!=="number") continue;
    artOf[it.row+"_"+it.col]=it.card?{card:it.card,art:artByCard[it.card]}:null;
  }
  undoStack.length=0;undoBtn.disabled=true;renderAll();
}

async function init(){
  const d=await Forge.load();
  plan=d.plan;cols=plan.cols;rows=plan.rows;cells=plan.cells;
  d.factions.forEach(f=>ELEMHEX[f.key]=f.hex);
  cells.forEach(c=>{if(c.card)artByCard[c.card]=c.art;});
  const urls=[];
  cols.forEach(k=>urls.push(Forge.urls.border(k),Forge.urls.symbol(k)));
  for(let n=1;n<=49;n++) urls.push(Forge.urls.marble(n,"top"),Forge.urls.marble(n,"bot"));
  cells.forEach(c=>{const u=artURL(c.card);if(u)urls.push(u);});
  await preload(urls);
  resetArt();build();
}
function resetArt(){cells.forEach(c=>{artOf[c.row+"_"+c.col]=c.card?{card:c.card,art:c.art}:null;});}

const undoBtn=document.getElementById("undo");
undoBtn.onclick=()=>{const h=undoStack.pop();if(h)swap(h[1],h[0],false);undoBtn.disabled=!undoStack.length;};
function setMode(m){MODE=m;mLight.classList.toggle("on",m==="light");mDark.classList.toggle("on",m==="dark");renderAll();}
const mLight=document.getElementById("mLight"), mDark=document.getElementById("mDark");
mLight.onclick=()=>setMode("light"); mDark.onclick=()=>setMode("dark");
let thinRAF=0;
document.getElementById("thin").oninput=e=>{THIN=+e.target.value;cancelAnimationFrame(thinRAF);thinRAF=requestAnimationFrame(renderAll);};
document.getElementById("expL").onclick=()=>exportSheet("light");
document.getElementById("expD").onclick=()=>exportSheet("dark");
document.getElementById("expJ").onclick=exportJSON;
document.getElementById("reset").onclick=()=>{clearPick();resetArt();undoStack.length=0;undoBtn.disabled=true;renderAll();};
document.getElementById("loadArt").onclick=()=>document.getElementById("artFiles").click();
document.getElementById("artFiles").onchange=async e=>{
  for(const f of e.target.files){const m=f.name.match(/(card-\d+)\.png$/i);if(m)localArt[m[1].toLowerCase()]=URL.createObjectURL(f);}
  const urls=Object.values(localArt);await preload(urls);renderAll();e.target.value="";
};
document.getElementById("impJ").onclick=()=>document.getElementById("jsonFile").click();
document.getElementById("jsonFile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{importJSON(JSON.parse(await f.text()));}catch(err){alert("Couldn't read that arrangement: "+err.message);}
  e.target.value="";
};
addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="z"&&!undoBtn.disabled){e.preventDefault();undoBtn.click();}});
init();
</script>
</body>
</html>
